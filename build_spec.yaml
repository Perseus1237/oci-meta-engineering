version: 0.1
component: build
timeoutInSeconds: 600
shell: bash
failImmediatelyOnError: true

steps:
  - type: Command
    name: Verify the SE factory and replay customer engagements
    command: |
      set -eu
      cd "${OCI_PRIMARY_SOURCE_DIR}"
      python3 -B -m unittest discover -s tests -v
      python3 -B se_factory.py demo
